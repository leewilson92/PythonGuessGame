name: ExpenseTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.expensetracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 记账
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ExpenseTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
        ExpenseTrackerTests: [test]
        ExpenseTrackerUITests: [test]
    test:
      targets:
        - ExpenseTrackerTests
        - ExpenseTrackerUITests
